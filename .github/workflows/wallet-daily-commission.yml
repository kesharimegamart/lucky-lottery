name: Wallet Daily Commission

on:
  workflow_dispatch:
  schedule:
    - cron: '47 18 * * *' # 00:17 IST

permissions:
  contents: read
  id-token: write

concurrency:
  group: wallet-daily-commission
  cancel-in-progress: false

jobs:
  commission:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMMISSION_START_IST: ${{ vars.COMMISSION_START_IST }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install Firestore client
        run: npm install --no-save --package-lock=false --ignore-scripts @google-cloud/firestore@7

      - uses: google-github-actions/auth@v3
        with:
          project_id: lucky-lottery-1d174
          workload_identity_provider: projects/124480241873/locations/global/workloadIdentityPools/lucky-lottery-commission/providers/github-actions
          service_account: wallet-daily-commission@lucky-lottery-1d174.iam.gserviceaccount.com

      - name: Verify Firestore access
        run: |
          node <<'JS'
          const {Firestore} = require('@google-cloud/firestore');
          const db = new Firestore({projectId: 'lucky-lottery-1d174'});
          db.collection('walletClients').limit(1).select().get().then(
            () => console.log('Firestore wallet read succeeded.'),
            error => { console.error(error.message); process.exitCode = 1; }
          ).finally(() => db.terminate());
          JS

      - name: Credit completed IST days
        if: vars.COMMISSION_START_IST != ''
        run: node wallet-daily-commission.cjs
