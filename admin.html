<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LUCKY LOTTERY — Admin</title><style>
:root{--gold:#ffe34d;--muted:#e6c5a0}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#fff;background:radial-gradient(circle at 12% 8%,#8b1717 0,transparent 28%),radial-gradient(circle at 88% 22%,#8b5a08 0,transparent 25%),linear-gradient(135deg,#160707,#351010 48%,#120808);min-height:100vh;position:relative;overflow-x:hidden}body:before{content:"$     ₹       $       ₹       $";position:fixed;inset:0;pointer-events:none;z-index:-1;color:#ffe34d;opacity:.075;font-size:clamp(35px,7vw,76px);font-weight:1000;letter-spacing:22px;line-height:2.2;overflow:hidden;transform:rotate(-18deg) scale(1.25);white-space:pre-wrap;text-shadow:0 0 18px #ffbd32}header{padding:22px 16px 18px;text-align:center;border-bottom:1px solid #ffd84d55;background:linear-gradient(120deg,#570e0eec,#241006ed)}.brand{font-weight:1000;letter-spacing:2px;font-size:clamp(25px,6vw,40px);color:#ffe34d;text-shadow:0 3px 0 #a51d12,0 0 24px #ffb52d}.sub{color:#d8c9f5;font-size:12px;letter-spacing:2px;margin-top:5px}.wrap{max-width:900px;margin:0 auto;padding:18px 14px 40px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:15px}.pill{background:#ffffff12;border:1px solid #ffffff25;border-radius:99px;padding:8px 12px;color:#e7dcff;font-size:12px}.hero{background:linear-gradient(145deg,#8d2020,#49100f 55%,#321b08);border:1px solid #ffe34d88;border-radius:24px;padding:22px 14px;text-align:center;box-shadow:0 18px 50px #0005}.eyebrow{color:#e8d8ff;font-size:12px;letter-spacing:2px;font-weight:800}.balls{display:flex;justify-content:center;gap:10px;margin:18px 0 12px}.ball{width:clamp(70px,18vw,100px);height:clamp(70px,18vw,100px);border-radius:50%;display:grid;place-items:center;font-size:clamp(34px,9vw,52px);font-weight:1000;color:white;text-shadow:0 3px 3px #0007;border:4px solid #ffffffcc;box-shadow:inset -9px -11px 16px #0005,inset 7px 8px 12px #ffffff65,0 9px 18px #0007;position:relative}.ball:after{content:"";position:absolute;width:24%;height:13%;border-radius:50%;background:#ffffff75;top:13%;left:20%;transform:rotate(-35deg)}.ball:nth-child(1){background:radial-gradient(circle at 30% 25%,#ff9fb9,#ed2767 60%,#9e1044)}.ball:nth-child(2){background:radial-gradient(circle at 30% 25%,#a6d8ff,#2876e7 60%,#143b99)}.ball:nth-child(3){background:radial-gradient(circle at 30% 25%,#fff0a0,#f4a51f 60%,#a9560c)}.resultMeta{color:var(--gold);font-weight:800;font-size:13px}.next{color:#d4c9ec;font-size:13px;margin-top:8px}.sectionTitle{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 12px}.sectionTitle h2{font-size:18px;margin:0}.sectionTitle small{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.slot{background:linear-gradient(145deg,#5a1919,#301010);border:1px solid #ffcf3f55;border-radius:15px;padding:12px;min-height:100px}.slotHead{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:800}.status{font-size:10px;color:#b9afd4;background:#ffffff12;padding:4px 7px;border-radius:20px}.num{font-size:27px;font-weight:1000;letter-spacing:5px;color:var(--gold);margin-top:10px;text-shadow:0 0 15px #ffc64c55}.pending{font-size:13px;color:#a99fc2;margin-top:12px}.note{text-align:center;color:#e9d8c5;font-size:12px;margin:20px 0 0;line-height:1.6}button{border:0;border-radius:12px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:linear-gradient(135deg,#fff06a,#ffb400 55%,#ed3b24);color:#321006}.secondary{background:#ffffff18;color:white}.danger{background:#9c2853;color:white}label{display:block;font-size:12px;color:#f0dff8;margin:10px 0 5px}input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #ffffff30;background:#1b0909;color:white;font:inherit}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.panel{background:#351313;border:1px solid #ffe34d66;border-radius:20px;padding:18px;box-shadow:0 20px 80px #0005}.adminItem{display:grid;grid-template-columns:1fr 100px auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #ffffff18;font-size:12px}.hidden{display:none!important}.msg{font-size:13px;color:#ffe34d;margin-top:10px;overflow-wrap:anywhere}@media(max-width:430px){.adminItem{grid-template-columns:1fr 82px}.adminItem button{grid-column:1/-1}.row{grid-template-columns:1fr}}
</style></head><body>
<header><div class="brand">★ LUCKY LOTTERY ★</div><div class="sub">SECURE ADMIN PANEL</div></header><main class="wrap">
<div id="loginPanel" class="panel"><h2 style="color:#ffe34d;margin-top:0">🔐 Admin Login</h2><label>Admin Email</label><input id="email" type="email" autocomplete="username" placeholder="अपना Firebase login email डालें"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="पासवर्ड"><div class="actions"><button class="primary" id="loginBtn">Login</button><a href="./" style="color:#ffe34d;align-self:center">Public Website</a></div><div class="msg" id="loginMsg"></div></div>
<div id="managePanel" class="panel hidden"><div class="top"><h2 style="color:#ffe34d;margin:0">रिजल्ट मैनेज करें</h2><button class="secondary" id="logoutBtn">Logout</button></div><div class="msg" id="who"></div><div class="row"><div><label>तारीख</label><input id="date" type="date"></div><div><label>समय</label><select id="time"></select></div></div><label>Triple Digit Number (000–999)</label><input id="number" inputmode="numeric" maxlength="3" placeholder="जैसे 047"><div class="actions"><button class="primary" id="saveBtn">Save & Schedule</button><a href="./" style="color:#ffe34d;align-self:center">Public Website देखें</a></div><p style="font-size:12px;color:#e9d8c5;line-height:1.5">नंबर निर्धारित तारीख और समय पर सार्वजनिक वेबसाइट पर दिखाई देगा। भविष्य के रिजल्ट सार्वजनिक रूप से समय से पहले पढ़े नहीं जा सकेंगे।</p><div class="adminList"><h3>इस तारीख के रिजल्ट</h3><div id="adminItems">लोड हो रहे हैं…</div></div><div class="msg" id="manageMsg"></div></div>
</main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";
import {getFirestore,collection,doc,setDoc,deleteDoc,getDocs,query,orderBy,Timestamp} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyBrhG_hJeFqtXOro0HI7C9OLdjd2T4ahsY",
  authDomain: "lucky-lottery-1d174.firebaseapp.com",
  projectId: "lucky-lottery-1d174",
  storageBucket: "lucky-lottery-1d174.firebasestorage.app",
  messagingSenderId: "124480241873",
  appId: "1:124480241873:web:4b2592767e7186dc3f05f0",
  measurementId: "G-TN1P1PTKJJ"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const pad=n=>String(n).padStart(2,'0'),dateKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const times=[];for(let m=600;m<=1260;m+=30)times.push(`${pad(Math.floor(m/60))}:${pad(m%60)}`);
const fmt=t=>{let [h,m]=t.split(':').map(Number);return `${h%12||12}:${pad(m)} ${h<12?'AM':'PM'}`};
const $=id=>document.getElementById(id);$('time').innerHTML=times.map(t=>`<option value="${t}">${fmt(t)}</option>`).join('');$('date').value=dateKey(new Date());
$('loginBtn').addEventListener('click',async()=>{$('loginMsg').textContent='लॉगिन हो रहा है…';try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);$('loginMsg').textContent=''}catch(e){$('loginMsg').textContent='लॉगिन असफल: ईमेल और पासवर्ड जाँचें।';console.error(e)}});
$('logoutBtn').addEventListener('click',()=>signOut(auth));
onAuthStateChanged(auth,async user=>{$('loginPanel').classList.toggle('hidden',!!user);$('managePanel').classList.toggle('hidden',!user);if(user){$('who').textContent='लॉगिन: '+user.email;await renderAdmin()}});
$('date').addEventListener('change',renderAdmin);$('saveBtn').addEventListener('click',saveResult);
async function renderAdmin(){try{const snap=await getDocs(query(collection(db,'results'),orderBy('date','desc')));let arr=snap.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x.date===$('date').value).sort((a,b)=>a.time.localeCompare(b.time));$('adminItems').innerHTML=arr.length?arr.map(x=>`<div class="adminItem"><span>${fmt(x.time)} · ${x.date}</span><b style="color:#ffd66b">${x.number}</b><button class="danger" data-id="${x.id}">Delete</button></div>`).join(''):'<p style="color:#e9d8c5;font-size:12px">इस तारीख के लिए अभी कोई नंबर सेट नहीं है।</p>';document.querySelectorAll('[data-id]').forEach(b=>b.addEventListener('click',()=>removeResult(b.dataset.id)))}catch(e){$('adminItems').textContent='डेटा लोड नहीं हुआ। Firestore Rules जाँचें।';console.error(e)}}
async function saveResult(){const date=$('date').value,time=$('time').value,number=$('number').value.trim();if(!date||!/^\d{3}$/.test(number)){$('manageMsg').textContent='तारीख चुनें और 000 से 999 तक तीन अंक डालें।';return}const publishAt=new Date(`${date}T${time}:00`);if(Number.isNaN(publishAt.getTime()))return;try{await setDoc(doc(db,'results',`${date}_${time.replace(':','-')}`),{date,time,number,publishAt:Timestamp.fromDate(publishAt),updatedAt:Timestamp.now()});$('number').value='';$('manageMsg').textContent='नंबर सेव हो गया।';await renderAdmin()}catch(e){$('manageMsg').textContent='सेव नहीं हुआ। Firestore Rules / लॉगिन जाँचें।';console.error(e)}}
async function removeResult(id){if(!confirm('क्या यह रिजल्ट हटाना चाहते हैं?'))return;try{await deleteDoc(doc(db,'results',id));$('manageMsg').textContent='रिजल्ट हटा दिया गया।';await renderAdmin()}catch(e){$('manageMsg').textContent='डिलीट नहीं हुआ।';console.error(e)}}
</script></body></html>
