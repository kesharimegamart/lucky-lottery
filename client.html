<div id="homeWallet" style="margin:0 0 14px">
  <a id="walletFallback" class="pill" href="./client.html">🔐 Client Login</a>
  <iframe id="walletFrame" title="Client Login और Fun Coin Wallet"
          style="display:block;width:100%;height:0;border:0"></iframe>
</div>

<script>
(() => {
  const frame = document.getElementById('walletFrame');
  const fallback = document.getElementById('walletFallback');

  frame.addEventListener('load', () => {
    const doc = frame.contentDocument;
    const main = doc?.querySelector('main.wrap');
    const login = doc?.getElementById('login');
    const panel = doc?.getElementById('panel');
    const history = doc?.getElementById('history')?.closest('.card');
    if (!main || !login || !panel || !history) return;

    const style = doc.createElement('style');
    style.textContent = `
      html, body { background: transparent; min-height: 0 }
      main.wrap { max-width: none; padding: 0; display: flow-root }
      main.wrap > nav, main.wrap > h1, main.wrap > p.muted,
      #who, #panel > .card > p.muted { display: none }
      #status:empty, #status.ok { display: none }
      .card {
        margin: 0 0 6px; padding: 10px 12px; border-radius: 12px;
        border-color: #ae8349; background: linear-gradient(135deg, #4d2118, #29100e)
      }
      #panel > .card > h2 { margin: 2px 0 9px; font-size: 16px }
      #panel .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px }
      #panel .stat { padding: 6px 8px; font-size: 12px }
      #panel .stat b { font-size: 17px; margin-top: 2px }
      #logoutBtn { padding: 6px 10px; font-size: 12px }
      details > summary { cursor: pointer; font-size: 13px; font-weight: 700; color: #ffe8a0 }
      details > .card { margin: 8px 0 0 }
      .wallet-login-box:has(#login.hidden) { display: none }
      .wallet-history-list { max-height: 230px; overflow: auto }
    `;
    doc.head.append(style);

    function makeDetails(label, className) {
      const details = doc.createElement('details');
      details.className = 'card ' + className;
      const summary = doc.createElement('summary');
      summary.textContent = label;
      details.append(summary);
      return details;
    }

    const loginBox = makeDetails('🔐 Client Login', 'wallet-login-box');
    login.before(loginBox);
    loginBox.append(login);

    const historyBox = makeDetails('📜 Wallet History', 'wallet-history-box');
    history.before(historyBox);
    historyBox.append(history);
    doc.getElementById('history').classList.add('wallet-history-list');

    const total = doc.getElementById('total');
    if (total) {
      const totalCard = total.closest('.stat');
      totalCard.parentElement.prepend(totalCard);
    }

    const resize = () => {
      frame.style.height = Math.ceil(main.getBoundingClientRect().height) + 'px';
    };
    const observer = new ResizeObserver(resize);
    observer.observe(main);
    resize();
    fallback.hidden = true;
  }, { once: true });

  frame.src = './client.html';
})();
</script>
